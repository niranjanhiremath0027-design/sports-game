<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penalty Shootout</title>
<style>
  :root{
    --night:#081611; --night-2:#0C2118; --ivory:#EEF5EF; --dim:#8FA69A;
    --grass:#3E9E62; --gold:#E0B23E; --red:#E0563E; --line:rgba(238,245,239,.12);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ivory);font-family:var(--sans);
    background:radial-gradient(1000px 620px at 80% 0%,rgba(62,158,98,.18),transparent 60%),
      linear-gradient(var(--night-2),var(--night) 60%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;
    -webkit-font-smoothing:antialiased}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,5vw,2.6rem);margin:0 0 6px;text-align:center}
  p.sub{color:var(--dim);margin:0 0 26px;text-align:center;max-width:44ch}

  .hud{display:flex;gap:14px;margin-bottom:26px;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;min-width:90px}
  .chip b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--gold)}
  .chip span{color:var(--dim);font-size:.78rem}

  .scene{perspective:1000px;width:min(560px,94vw)}
  .pitch{position:relative;width:100%;aspect-ratio:4/3;transform-style:preserve-3d;transform:rotateX(28deg);
    border-radius:14px;overflow:visible;
    background:repeating-linear-gradient(90deg,#2c7a49 0 40px,#2f8350 40px 80px);
    box-shadow:0 40px 70px -30px rgba(0,0,0,.8);border:1px solid rgba(238,245,239,.15)}

  .goal{position:absolute;left:8%;right:8%;top:6%;height:46%;
    border:6px solid var(--ivory);border-bottom:none;border-radius:4px 4px 0 0;
    background:linear-gradient(rgba(238,245,239,.06),transparent);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
  .cell{border:1px dashed rgba(238,245,239,.18);cursor:pointer;position:relative;transition:background .2s}
  .cell:hover{background:rgba(224,178,62,.15)}
  .cell.disabled{pointer-events:none}

  .keeper{position:absolute;left:50%;top:6%;height:46%;width:60px;margin-left:-30px;
    display:flex;align-items:flex-end;justify-content:center;transition:transform .45s cubic-bezier(.2,.8,.2,1);
    transform:translate(0,0)}
  .keeper .body{width:26px;height:60px;border-radius:10px 10px 4px 4px;background:linear-gradient(#E0563E,#a83321);
    box-shadow:0 8px 16px -6px #000}
  .keeper .head{width:18px;height:18px;border-radius:50%;background:#f2c9a6;margin:0 auto -4px;position:relative;top:6px}

  .ball{position:absolute;left:50%;bottom:4%;width:26px;height:26px;margin-left:-13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#c9c9c9 70%);
    box-shadow:0 10px 18px -6px rgba(0,0,0,.7);
    transition:transform 1.1s cubic-bezier(.25,.7,.3,1), left 1.1s cubic-bezier(.25,.7,.3,1), bottom 1.1s cubic-bezier(.25,.7,.3,1);
  }

  .result{margin-top:22px;min-height:1.4em;font-family:var(--serif);font-size:1.2rem;text-align:center}
  .result.goal-txt{color:var(--gold)}
  .result.save-txt{color:var(--red)}

  .btn{margin-top:18px;display:inline-block;padding:11px 22px;border-radius:999px;background:var(--gold);
    color:#221703;font-weight:600;border:none;cursor:pointer;font-size:.95rem;transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.4;cursor:default;transform:none}

  .hint{color:var(--dim);font-size:.85rem;margin-top:8px;text-align:center}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>

<h1>Penalty Shootout</h1>
<p class="sub">Click a spot in the goal to place your shot. The keeper guesses too — beat them to the corner.</p>

<div class="hud">
  <div class="chip"><b id="scoreVal">0</b><span>Goals</span></div>
  <div class="chip"><b id="attemptVal">0</b><span>Attempts</span></div>
  <div class="chip"><b id="streakVal">0</b><span>Best streak</span></div>
</
